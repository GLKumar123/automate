name: ServiceNow Incident Status Report
on:
  schedule:
    - cron: "30 3 * * *"
    - cron: "30 11 * * *"

  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: servicenow-incident-report
  cancel-in-progress: false

jobs:
  incident-report:
    name: Fetch and Report Incidents
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      SERVICENOW_INSTANCE: ${{ secrets.SERVICENOW_INSTANCE }}
      SERVICENOW_USERNAME: ${{ secrets.SERVICENOW_USERNAME }}
      SERVICENOW_PASSWORD: ${{ secrets.SERVICENOW_PASSWORD }}
      TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}

      SERVICENOW_QUERY: ${{ vars.SERVICENOW_QUERY }}
      SERVICENOW_PAGE_SIZE: "1000"

      PYTHONUNBUFFERED: "1"
      TZ: Asia/Kolkata

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate configuration
        run: |
          python - <<'PY'
          import os
          import sys

          required = [
              "SERVICENOW_INSTANCE",
              "SERVICENOW_USERNAME",
              "SERVICENOW_PASSWORD",
              "TEAMS_WEBHOOK_URL",
          ]

          missing = [key for key in required if not os.getenv(key)]

          if missing:
              print("Missing required GitHub secrets:", ", ".join(missing))
              sys.exit(1)

          print("Required configuration is present.")
          PY

      - name: Fetch incidents and work notes
        run: python scripts/fetch_incidents.py

      - name: Generate CSV and JSON reports
        run: python scripts/generate_report.py

      - name: Send incident report to Teams
        run: python scripts/send_teams_report.py

      - name: Upload report artifacts
        if: always() && hashFiles('reports/incidents.csv', 'reports/incidents.json', 'reports/incident-summary.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: servicenow-incident-report-${{ github.run_id }}
          path: |
            reports/incidents.csv
            reports/incidents.json
            reports/incident-summary.json
          retention-days: 7
          if-no-files-found: warn
